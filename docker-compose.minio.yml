# Starts a local MinIO object storage instance.
#
# Start:   docker compose -f docker-compose.minio.yml up -d
# Stop:    docker compose -f docker-compose.minio.yml down
# Console: http://localhost:9001  (minioadmin / minioadmin)
# S3 API:  http://localhost:9000

version: "3.8"

services:
  minio:
    image: minio/minio:latest
    container_name: pipeline-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3-compatible API — storage.py connects here
      - "9001:9001"   # Web console — open in browser to inspect files
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  minio-data:
    driver: local